name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax check every module
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check
      - run: npm test

  browser:
    name: headless Chrome (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run vendor:mujoco
      - name: Run CDP smoke + physics fixture
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PORT: 4173
        run: npm run test:e2e -- --screenshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: tests/e2e/.artifacts/
          if-no-files-found: ignore
